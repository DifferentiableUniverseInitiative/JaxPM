name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run_tests:
    runs-on: ubuntu-latest
    # The single-device step needs the 8 host devices too: without them it deadlocks
    # in the relative-painting test_nbody_grad cases (all threads idle on futexes;
    # reproduced under `taskset -c 0-3`). tests/conftest.py used to set this.
    # --xla_cpu_multi_thread_eigen=false: XLA's Eigen intra-op threads starve the
    # 8-host-device CPU collectives when cores are scarce, killing test_fwd_rev_gradients
    # (SIGABRT in the jacrev backward pass on the 4-vCPU runner; the same class of hang
    # jax-fli fixed in its CI). Locally that test hangs under `taskset -c 0-3` without
    # this flag and passes in ~13s with it. It slows the single-device suite from ~9 to
    # ~16 min on 4 cores.
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_FLAGS: "--xla_force_host_platform_device_count=8 --xla_cpu_multi_thread_eigen=false"
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements-test.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Cache system dependencies
      uses: actions/cache@v4
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/tests.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Install JAX first as it's a key dependency
        pip install jax
        # Install packages with test dependencies
        pip install -e .[test]
        # Install build dependencies
        pip install setuptools cython mpi4py
        # Depends on the new jax_cosmo cache (see ASKabalan:better-cache).
        # Temporary until the cache + import-error fixes merge upstream.
        pip install git+https://github.com/ASKabalan/jax_cosmo@better-cache
        # PyPI jax-healpy 0.6 collapsed multi-dim batch shapes in get_interp_weights /
        # get_all_neighbours, breaking spherical.py broadcasting. Fixed upstream
        # (CMBSciPol/jax-healpy#2) and released as 0.8.1, which pyproject.toml now
        # floors; the explicit pin makes the resolution independent of the
        # `pip install -e .[test]` cache above.
        pip install "jax-healpy>=0.8.1"
        # Install test requirements with no-build-isolation for faster builds
        pip install -r requirements-test.txt --no-build-isolation
        echo "numpy version installed:"
        python -c "import numpy; print(numpy.__version__)"

    - name: Run Single Device Tests
      # Green runs take ~10 min (~16 with single-threaded Eigen); fail fast on a hang
      # instead of burning 6 h.
      timeout-minutes: 30
      run: |
        cd tests
        pytest -v -s -m "not distributed"

    - name: Run Distributed tests
      # Green runs take ~56 min.
      timeout-minutes: 90
      run: |
        pytest -v tests/test_distributed_pm.py
